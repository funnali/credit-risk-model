name: CI Pipeline

on:
  push:
    branches: [ main, task-6 ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8 linter
        run: |
          flake8 src/ tests/ --max-line-length=120 --ignore=E501,W503,E241,E226,W292,F841,F401,E402,E302,W291,E303,E305,E711,E712,W503,W504,C901

      - name: Run pytest
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          pytest tests/test_data_processing.py -v